server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源长缓存（产物文件名带 hash）
  location assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # pure-web 默认 hash 路由，单页面入口兜底即可；若切换为 history 模式同样适用
  location / {
    try_files $uri $uri/ /index.html;
  }
}
