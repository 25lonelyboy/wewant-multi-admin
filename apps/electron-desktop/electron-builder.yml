appId: com.multiadmin.desktop
productName: Multi Admin

directories:
  output: release/${version}

files:
  - 'dist-electron/**/*'
  - 'assets/**/*'
  - 'package.json'

asar: true

# 打包期 Electron 产物 zip 下载镜像：electron-builder 程序化调用 @electron/get，
# 拿不到 .npmrc 的 electron_mirror（仅安装阶段生效），必须在此显式声明，否则回落 GitHub 超时
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: '${productName}_${version}_win.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 'Multi Admin'

mac:
  target: [dmg]
  artifactName: '${productName}_${version}_mac.${ext}'

linux:
  target: [AppImage, deb]
  artifactName: '${productName}_${version}_linux.${ext}'

# 自动更新预留（当前不启用）
# publish:
#   provider: github
#   releaseType: release
