# GitHub CI：入库后异步安全网（决策见 docs/decisions/ADR-006-github-ci.md）
# 报警式不拦截：仅 push master + 手动触发；无分支保护；七 job 全并行。
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  HUSKY: '0'

jobs:
  gate:
    name: gate（pnpm check 全量门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  docker-build:
    name: docker-build（构建验证，不 push）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # 镜像沿用 coverage job 同源 digest pin（生产安全基线：全仓镜像引用必须 pin；+2 pin 后 check-digests 计数 8 → 10，见 Step 3）
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b # pin: 2026-08-27 (pnpm ops:check-digests quarterly)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multi_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multi_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # pin: 2026-08-27 (pnpm ops:check-digests quarterly)
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 pure-web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pure-web/Dockerfile
          push: false
          load: true
          tags: multi-admin-web:ci
          build-args: |
            PNPM_REGISTRY=https://registry.npmjs.org
            COREPACK_NPM_REGISTRY=https://registry.npmjs.org
      - name: 构建 nestjs-server 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/nestjs-server/Dockerfile
          push: false
          load: true
          tags: multi-admin-server:ci
          build-args: |
            PNPM_REGISTRY=https://registry.npmjs.org
            COREPACK_NPM_REGISTRY=https://registry.npmjs.org
            PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
      - name: server 镜像启动冒烟（/health 探针 + entrypoint 三段断言）
        # 冒烟专用丢弃值（非生产秘密，内联安全）；Linux runner 走 --network host，容器内 localhost 即本 job services
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multi_admin?schema=public
          REDIS_URL: redis://localhost:6379
          ADMIN_INIT_PASSWORD: smoke-admin-password
          JWT_ACCESS_SECRET: smoke-access-secret-000000000000000000
          JWT_REFRESH_SECRET: smoke-refresh-secret-000000000000000000
        run: bash scripts/ops/server-smoke.sh
      - name: web 镜像启动冒烟（重试循环，容忍冷启动延迟）
        run: |
          docker run -d --name web-smoke -p 8848:80 multi-admin-web:ci
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8848) || true
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs web-smoke
          docker rm -f web-smoke
          test "$code" = "200"

  audit:
    name: audit（报警式，不红）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm audit（只解析 lockfile，免 install）
        # npmmirror 不支持 audit 端点，强制走官方 registry
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
        continue-on-error: true

  coverage:
    name: coverage（≥80% 报警式硬门槛）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b # pin: 2026-08-27 (pnpm ops:check-digests quarterly)
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # pin: 2026-08-27 (pnpm ops:check-digests quarterly)
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multi_admin?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test:coverage --filter=@multi-admin/nestjs-server

  coverage-web:
    name: coverage-web（pure-web 报警式）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test:coverage --filter=@multi-admin/pure-web

  e2e-web:
    name: e2e-web（Playwright E2E 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec turbo run test:e2e --filter=@multi-admin/pure-web

  doc-lint:
    name: doc-lint（报警式，不红）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ④ covers 漂移靠比对完整 git 历史的提交时间；默认 depth=1 浅克隆会让所有路径时间戳塌缩到 HEAD，漂移检测静默失效
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 文档一致性五检查
        run: node scripts/doc-lint.cjs .
        continue-on-error: true
